[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-switcher"
version = "0.1.24"
description = "Deprecated: install claude-china and use claudec instead"
readme = {file = "README.md", content-type = "text/markdown"}
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["claude-china>=0.2.1"]
classifiers = [
    "Development Status :: 7 - Inactive",
]

[project.urls]
Homepage = "https://github.com/invoker-bot/Claude-China"
Repository = "https://github.com/invoker-bot/Claude-China"
Issues = "https://github.com/invoker-bot/Claude-China/issues"
"Replacement package" = "https://pypi.org/project/claude-china/"

[project.optional-dependencies]
desktop = ["claude-china[desktop]>=0.2.1"]

[project.scripts]
code-ai = "code_ai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["code_ai*"]
