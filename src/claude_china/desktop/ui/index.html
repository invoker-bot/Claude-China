<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Claude China</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header" id="app-header">
    <div class="brand"><img id="brand-mark" src="icon.png" width="36" height="36" alt="" draggable="false"><span>Claude China</span></div>
    <nav class="top-nav" aria-label="主导航">
      <button class="top-link is-active" id="home-button" type="button" aria-current="page">我的应用</button>
      <button class="top-link" id="open-settings" type="button">设置<span class="draft-dot" aria-hidden="true"></span></button>
    </nav>
    <button class="btn header-update" id="open-updates" type="button"><span data-icon="refresh"></span>检查更新</button>
  </header>
  <main class="panel" id="launcher-main">
    <div class="page-heading">
      <div><h1>我的应用</h1><p>选择应用，开始工作。</p></div>
      <button class="icon-button refresh-button" id="refresh-apps" type="button" aria-label="刷新应用状态" title="刷新应用状态"><span data-icon="refresh"></span></button>
    </div>
    <div id="apps" class="bays"></div>
    <section class="launch-settings" aria-labelledby="launch-settings-title">
      <span class="settings-symbol" data-icon="network"></span>
      <div><h2 id="launch-settings-title">启动设置</h2><p id="common-summary"></p></div>
      <button class="text-button" id="gear-common" type="button" aria-expanded="false" aria-controls="editor-common">管理设置<span data-icon="arrow"></span></button>
    </section>
  </main>
  <footer class="foot" id="foot">
    <span id="app-count">正在读取应用…</span><span class="foot-info">设置仅保存在此设备</span>
    <button id="footer-about" type="button" aria-label="关于 Claude China"><span id="footer-version"></span></button>
  </footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="overlay" id="launcher-overlay" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">
      <aside class="settings-sidebar">
        <h2 class="sidebar-title">设置</h2>
        <nav aria-label="设置分类" class="settings-nav">
          <button class="settings-link" id="nav-common" data-panel="common" type="button"><span data-icon="settings"></span>通用设置<span class="draft-dot" aria-hidden="true"></span></button>
          <p class="nav-caption">应用设置</p><div id="settings-app-nav"></div><div class="nav-divider"></div>
          <button class="settings-link" data-panel="updates" type="button"><span data-icon="refresh"></span>版本更新</button>
          <button class="settings-link" data-panel="about" type="button"><span data-icon="info"></span>关于</button>
        </nav>
      </aside>
      <div class="settings-main">
        <div class="dialog-head"><div><h2 id="dialog-title">通用设置</h2><p id="dialog-description">应用启动时使用的共同配置。</p></div><button class="icon-button" id="dialog-close" type="button" aria-label="关闭设置" title="关闭设置"><span data-icon="close"></span></button></div>
        <div id="settings-pages">
          <section class="editor settings-panel" id="editor-common" hidden inert>
            <div class="editor-body">
              <label class="switch" for="proxy"><span class="switch-text"><span class="field-label">启动前检查系统代理</span><span class="field-hint">系统代理未开启时取消启动</span></span><input type="checkbox" id="proxy" role="switch"><span class="switch-ui" aria-hidden="true"></span></label>
              <div class="field"><h3 class="field-label">通用环境变量</h3><p class="field-hint">每个应用启动时都会注入，专有设置优先。</p><div class="env-columns" aria-hidden="true"><span>变量名</span><span>值</span></div><div id="common-env" class="env-list"></div><button class="add-row" id="add-common" type="button"><span data-icon="plus"></span>添加变量</button></div>
              <p class="form-error" id="error-common" role="alert" hidden></p>
            </div>
            <div class="editor-actions"><span class="save-state" id="save-state-common">仅保存在当前设备</span><button class="btn" id="cancel-common" type="button">取消</button><button class="btn btn--solid" id="save-settings" type="button">保存设置</button></div>
          </section>
          <div id="app-editors"></div>
          <section class="settings-panel" id="update-panel" hidden>
            <div class="editor-body">
              <div class="update-banner"><span data-icon="refresh"></span><div><h3>Claude China</h3><p id="update-version"></p></div></div>
              <p class="update-status" id="update-status" role="status" aria-live="polite">正在读取版本…</p><progress id="update-progress" max="100" value="0" aria-label="更新下载进度" hidden></progress>
              <p class="field-hint" id="update-hint">安装更新会重启启动器，已启动的应用不受影响。</p><p class="dialog-warning" id="update-warning" role="alert" hidden></p>
            </div>
            <div class="editor-actions"><button class="text-button" id="update-release" type="button">发布页面<span data-icon="external"></span></button><span class="dialog-spacer"></span><button class="btn" id="update-cancel" type="button" hidden>取消下载</button><button class="btn btn--solid" id="update-action" type="button" disabled>检查更新</button></div>
          </section>
          <section class="settings-panel" id="about-panel" hidden>
            <div class="editor-body about-content"><img src="icon.png" alt="" width="64" height="64"><h3>Claude China</h3><p class="dialog-version" id="about-version"></p><p>统一启动 Claude、Codex 与 Grok Bot，管理代理和环境变量。</p><div class="about-location"><span>配置文件</span><code>~/.claudec/desktop.yaml</code></div></div>
            <div class="editor-actions"><button class="text-button" id="about-release" type="button">发布页面<span data-icon="external"></span></button><span class="dialog-spacer"></span><button class="btn btn--solid" id="about-updates" type="button">检查更新</button></div>
          </section>
        </div>
      </div>
    </section>
  </div>
  <script src="icons.js"></script><script src="settings.js"></script><script src="app.js"></script><script src="preview.js"></script>
</body>
</html>
