name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: macos-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}

    - name: Install package + test deps
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest Pillow

    - name: Run tests
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      shell: bash
      run: |
        python - <<'PY'
        import os, runpy
        version = runpy.run_path("src/claude_china/__init__.py")["__version__"]
        if os.environ["REF_TYPE"] == "tag":
            assert os.environ["RELEASE_TAG"] == "v" + version, "Tag does not match application version"
        PY
        python -m pytest tests/ -q

    - name: Verify real Grok npm upgrade on macOS
      if: runner.os == 'macOS'
      run: python tests/grok_npm_smoke.py

  publish:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build and validate packages
      run: |
        python -m build
        python -m twine check --strict dist/*

    - uses: actions/upload-artifact@v4
      with:
        name: python-packages
        path: dist/*
        if-no-files-found: error

    - name: Publish to PyPI
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python -m twine upload dist/* --skip-existing
