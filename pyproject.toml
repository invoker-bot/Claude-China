[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-china"
version = "0.4.5"
description = "Claude China: AI coding profiles and a desktop launcher"
readme = {file = "README.md", content-type = "text/markdown"}
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=5.0",
    "typer>=0.9.0",
]

[project.urls]
Homepage = "https://github.com/invoker-bot/Claude-China"
Repository = "https://github.com/invoker-bot/Claude-China"
Issues = "https://github.com/invoker-bot/Claude-China/issues"

[project.optional-dependencies]
desktop = ["pywebview>=6.2.1", "psutil>=5.9", "pystray>=0.19.5", "Pillow>=9", "certifi>=2024.2.2"]
test = ["pytest", "Pillow>=9", "psutil>=5.9", "certifi>=2024.2.2"]

[project.scripts]
claudec = "claude_china.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["claude_china*"]

[tool.setuptools.package-data]
claude_china = ["desktop/ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
