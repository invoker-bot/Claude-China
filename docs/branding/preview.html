<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude China · 图标与动效</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eeebe5; color: #282621; font: 14px/1.6 "Segoe UI", "Microsoft YaHei UI", sans-serif; }
    main { max-width: 800px; padding: 36px 28px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
    .eyebrow { color: #8a6c5e; font: 11px/1.5 monospace; letter-spacing: .15em; }
    h1 { margin: 6px 0 0; font-size: 30px; font-weight: 550; letter-spacing: -.04em; }
    p { margin: 4px 0 0; color: #777167; }
    button { border: 1px solid #c7b6a8; background: transparent; border-radius: 24px; padding: 10px 19px; font: inherit; color: #6f4935; cursor: pointer; }
    button:hover { background: #e7ded4; }
    button:focus-visible { outline: 2px solid #c96c4a; outline-offset: 4px; }
    .surfaces { display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border-radius: 20px; }
    .surface { min-height: 264px; display: grid; place-items: center; position: relative; }
    .light { background: #faf8f3; }
    .dark { background: #24231f; color: #aaa59b; }
    .surface img { width: 152px; height: 152px; }
    .caption { position: absolute; left: 20px; bottom: 16px; font-size: 11px; letter-spacing: .08em; color: #91867a; }
    .sizes { display: flex; align-items: end; gap: 30px; padding: 30px 20px 24px; border-bottom: 1px solid #d8d1c7; }
    figure { margin: 0; display: grid; justify-items: center; gap: 10px; }
    figcaption { font: 11px monospace; color: #8b8073; }
    footer { margin-top: 20px; display: flex; justify-content: space-between; gap: 16px; font-size: 12px; color: #817567; }
    @media (max-width: 520px) {
      main { padding: 24px 18px; }
      .surface { min-height: 210px; }
      .surface img { width: 110px; height: 110px; }
      .sizes { gap: 22px; padding-inline: 4px; }
      footer { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <div class="eyebrow">DESKTOP IDENTITY / 01</div>
        <h1>Claude China</h1>
        <p>暖陶土色 · 独立的守护标记</p>
      </div>
      <button id="play" type="button">重播动作 ↗</button>
    </header>
    <div class="surfaces">
      <div class="surface light">
        <img class="mark" src="../../src/claude_china/desktop/ui/icon.png" alt="Claude China 浅色背景图标">
        <span class="caption">LIGHT</span>
      </div>
      <div class="surface dark">
        <img class="mark" src="../../src/claude_china/desktop/ui/icon.png" alt="Claude China 深色背景图标">
        <span class="caption">DARK</span>
      </div>
    </div>
    <div class="sizes" aria-label="图标实际尺寸">
      <figure><img class="mark" src="../../src/claude_china/desktop/ui/icon.png" width="16" height="16" alt=""><figcaption>16px</figcaption></figure>
      <figure><img class="mark" src="../../src/claude_china/desktop/ui/icon.png" width="24" height="24" alt=""><figcaption>24px</figcaption></figure>
      <figure><img class="mark" src="../../src/claude_china/desktop/ui/icon.png" width="32" height="32" alt=""><figcaption>32px</figcaption></figure>
      <figure><img class="mark" src="../../src/claude_china/desktop/ui/icon.png" width="48" height="48" alt=""><figcaption>48px</figcaption></figure>
      <figure><img class="mark" src="../../src/claude_china/desktop/ui/icon.png" width="64" height="64" alt=""><figcaption>64px</figcaption></figure>
    </div>
    <footer><span>操作时轻轻伸缩、摆动，约一秒后归位。</span><span>Windows · macOS</span></footer>
  </main>
  <script>
    document.getElementById("play").addEventListener("click", () => {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      const frames = Array.from({ length: 14 }, (_, i) => {
        const t = i / 13;
        const breath = Math.sin(Math.PI * t);
        return { transform: `rotate(${-12 * Math.sin(2 * Math.PI * t) * breath}deg) scale(${1 - .09 * breath})` };
      });
      for (const mark of document.querySelectorAll(".mark")) {
        for (const animation of mark.getAnimations()) animation.cancel();
        mark.animate(frames, { duration: 960, iterations: 1 });
      }
    });
  </script>
</body>
</html>
